version: "3"

tasks:
  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix
